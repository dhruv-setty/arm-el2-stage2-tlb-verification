name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys nextpnr-ecp5 libgmp-dev zlib1g-dev
      - name: Install Sail 0.20.3
        run: |
          curl -sL https://github.com/rems-project/sail/releases/download/0.20.3-binary/sail-Linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sail/bin" >> "$GITHUB_PATH"
      - run: ./scripts/check.sh
